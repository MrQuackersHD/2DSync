name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release, for example v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install CIA packaging tools
        run: |
          set -eux
          git clone --depth 1 --recursive https://github.com/diasurgical/bannertool.git /tmp/bannertool
          make -C /tmp/bannertool -j"$(nproc)"
          install -m 755 /tmp/bannertool/output/linux-x86_64/bannertool /usr/local/bin/bannertool
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/project_ctr
          make -C /tmp/project_ctr/makerom -j"$(nproc)"
          install -m 755 /tmp/project_ctr/makerom/makerom /usr/local/bin/makerom
      - name: Build
        run: make -C 3ds-client
      - name: Verify release binaries
        run: test -f 3ds-client/2DSync.3dsx && test -f 3ds-client/2DSync.cia
      - name: Checksums
        run: |
          cd 3ds-client
          sha256sum 2DSync.3dsx 2DSync.cia > SHA256SUMS 2>/dev/null || sha256sum 2DSync.3dsx > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            3ds-client/2DSync.cia
            3ds-client/2DSync.3dsx
            3ds-client/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ inputs.tag }}" -y 2>/dev/null || true
          gh release create "${{ inputs.tag }}" dist/* \
            --title "${{ inputs.tag }}" \
            --notes-file CHANGELOG.md
