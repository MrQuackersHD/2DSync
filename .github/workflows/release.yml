name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release, for example v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Build
        run: make -C 3ds-client
      - name: Checksums
        run: |
          cd 3ds-client
          sha256sum 2DSync.3dsx 2DSync.cia > SHA256SUMS 2>/dev/null || sha256sum 2DSync.3dsx > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            3ds-client/2DSync.cia
            3ds-client/2DSync.3dsx
            3ds-client/SHA256SUMS
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" dist/* \
            --title "${{ inputs.tag }}" \
            --notes-file CHANGELOG.md
