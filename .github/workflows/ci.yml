name: CI

on:
  push:
  pull_request:

jobs:
  host-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run portable tests
        run: make -C tests/host test

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

  3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 3DSX and CIA when makerom is installed
        run: make -C 3ds-client
      - uses: actions/upload-artifact@v4
        with:
          name: 2DSync-homebrew
          path: |
            3ds-client/2DSync.3dsx
            3ds-client/2DSync.smdh
          if-no-files-found: error
